[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zuspec-synth"
dynamic = ["version"]
description = "Synthesis transformations for Zuspec IR"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "zuspec-dataclasses",
    "zuspec-ir-core>=0.2.0",
    "dv-flow-mgr",
    # Both imported at module scope: pydantic by dfm.py, yaml by ir/boundary.py.
    "pydantic",
    "PyYAML",
    # SAT checks of proc.seqcorr (sequential correspondence)
    "python-sat",
]

[project.optional-dependencies]
# The SV emitters (fsm/mmr/protocol -> SV) live in zuspec-be-sv and are
# imported lazily.
sv = [
    "zuspec-be-sv>=0.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.entry-points."dv_flow.mgr"]
zuspec-synth = "zuspec.synth.__ext__"

[project.entry-points."zuspec.ext"]
zuspec_synth = "zuspec.synth.cli_plugin:SynthPlugin"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
# templates/*.v: mls.py embeds them in the generated Verilog.
"zuspec.synth" = ["flow.dv", "py.typed", "templates/*.v"]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
